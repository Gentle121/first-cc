name: 打 tag 自动发 Release

# 推 v* 标签 = 发版：自动跑测试、打包、建 Release、传附件。
# 失败后想重跑：在 Actions 页面点 “Re-run jobs”，ref 仍是原来那个标签，不会发错版本。
on:
  push:
    tags:
      - "v*"

# 建 Release / 传附件需要写权限，其余保持默认只读
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # runner 的控制台默认是 cp1252，脚本里 print 中文会 UnicodeEncodeError；
      # 开 UTF-8 模式，测试输出和构建日志里的中文才不会把整步跑挂
      PYTHONUTF8: "1"
    steps:
      # fetch-depth: 0 不能省：默认只抓 1 个提交、且不抓标签，而生成正文要靠
      # git describe / git log 去查「上一个 v* 标签」和两个标签之间的提交列表。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: 跑状态机测试
        run: python test_pomodoro.py

      # 这里刻意用英文名打包（本地 打包.bat 仍然出中文名）：GitHub 会剥掉附件名里的
      # 非 ASCII 字符，中文名会被静默吞成 default.exe；顺带让 zip 内部也不出现中文路径。
      - name: 打包单文件版
        run: python -m PyInstaller --add-data "assets;assets" --noconfirm --onefile --windowed --name pomodoro-timer pomodoro.py

      - name: 打包快速启动版
        run: python -m PyInstaller --add-data "assets;assets" --noconfirm --onedir --windowed --name pomodoro-timer-faststart pomodoro.py

      # exe 是 --windowed 打的，控制台里看不到任何输出；用 --selftest 写出的文件确认
      # 它真能启动（通知弹不出来只记在文件里，不算构建失败）
      - name: 冒烟测试（确认 exe 能启动）
        shell: pwsh
        run: |
          $exe = "dist\pomodoro-timer.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "$exe --selftest 超时未退出" }
          $log = Join-Path $env:TEMP "pomodoro_tk\selftest.txt"
          if (-not (Test-Path $log)) { throw "exe 没写出 selftest.txt，说明它根本没跑起来" }
          Get-Content $log

      - name: 压缩快速启动版
        shell: pwsh
        run: Compress-Archive -Path "dist\pomodoro-timer-faststart" -DestinationPath "dist\pomodoro-timer-faststart.zip" -Force

      # 正文由 tools/make_release_notes.py 生成：逐条列出本次的提交，每条都能点进去看
      # 那次提交的具体改动。不用 gh 的 --generate-notes —— 它只会留一行
      # "Full Changelog: v1.0.0...v1.1.0"，点进去是一大坨混合 diff，看不出改了什么。
      # 用 -o 让 Python 自己写文件（UTF-8）：走 shell 重定向会踩控制台编码的坑。
      - name: 生成 Release 正文
        run: python tools/make_release_notes.py --to $env:GITHUB_REF_NAME -o dist\release_notes.md

      - name: 建 Release 并上传附件
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          # 标题用中文「番茄钟 vX.Y.Z」（中英之间留一个空格）。标题走 API 的 JSON 字段，
          # 不受附件名那条 ASCII 限制（附件名非 ASCII 会被 GitHub 静默剥成 default.exe）。
          $title = "番茄钟 $tag"
          $assets = @("dist\pomodoro-timer.exe", "dist\pomodoro-timer-faststart.zip")
          $notes = "dist\release_notes.md"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # 同名 Release 已存在（重跑或补传），覆盖附件，并把标题/正文刷成最新生成的
            gh release upload $tag $assets --clobber
            gh release edit $tag --title $title --notes-file $notes
          } else {
            gh release create $tag $assets --title $title --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "创建 Release / 上传附件失败" }
